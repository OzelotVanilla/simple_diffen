name: Deploy to GitHub Pages

# Adopted from ChatGPT.

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: 10

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "lts/*"
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build
              run: pnpm build

            - name: Verify build output
              run: |
                  pwd
                  ls -lah ./output
                  test -s ./output/index.html

            - name: Configure Pages
              uses: actions/configure-pages@v6

            - name: Upload artifact
              id: upload
              uses: actions/upload-pages-artifact@v5
              with:
                  name: github-pages
                  path: ./output

            - name: Verify uploaded artifact
              run: |
                  echo "Artifact ID is ${{ steps.upload.outputs.artifact_id }}"
                  test -n "${{ steps.upload.outputs.artifact_id }}"

    deploy:
        needs: build
        runs-on: ubuntu-latest

        permissions:
            pages: write
            id-token: write

        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        steps:
            - name: Deploy
              id: deployment
              uses: actions/deploy-pages@v5
